<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Бренды компании О.А.З.И.С">

    <title>О.А.З.И.С — Наши бренды</title>

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/partners.css">

    <script src="js/include.js" defer></script>
</head>

<body>
    <div id="header-placeholder"></div>

    <main>
       
        <section class="partners-main-block">
            <div class="partners-main-block-text">
                <h1>Наши бренды</h1>
                <p>Направления и продукты, развиваемые компанией О.А.З.И.С</p>
            </div>
        </section>

        
        <section class="partners-grid-block">
            <div class="partners-category">
                <div class="partners-grid">

                    <div class="partner-card">
                        <div class="partner-card-logo">
                            <img
                                src="resource/Partnerts_page/а8.webp"
                                alt="Логотип О.А.З.И.С"
                                loading="lazy"
                                decoding="async">
                        </div>

                        <p class="partner-card-name">ААА888</p>
                    </div>

                    <div class="partner-card">
                        <div class="partner-card-logo">
                            <img
                                src="resource/Partnerts_page/инхим-converted.webp"
                                alt="Логотип О.А.З.И.С Семена"
                                loading="lazy"
                                decoding="async">
                        </div>

                        <p class="partner-card-name">ИНХИМ</p>
                    </div>

                    <div class="partner-card">
                        <div class="partner-card-logo">
                            <img
                                src="resource/Partnerts_page/хреновые_семена-converted.webp"
                                alt="Логотип О.А.З.И.С Селекция"
                                loading="lazy"
                                decoding="async">
                        </div>

                        <p class="partner-card-name">Хреновые семена</p>
                    </div>                
                </div>
            </div>
        </section>
    </main>

    <div id="footer-placeholder"></div>
</body>
</html>
