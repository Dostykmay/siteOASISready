<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="О.А.З.И.С — партнёр хоккейного клуба «Буран»">

    <title>О.А.З.И.С — ХК «Буран»</title>

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/buran.css">

    <script src="js/include.js" defer></script>

    <style>
        .footer{
            background: linear-gradient(
                180deg,
                #0b2544 0%,
                #204d84 100%
            );
        }
    </style>
</head>

<body>
    <div id="header-placeholder"></div>

    <main>
        <section class="buran-page" aria-labelledby="buran-title">
            <div class="buran-page-container">

                <div class="buran-page-content">
                    <p class="buran-label">
                        О.А.З.И.С × ХК «Буран»
                    </p>

                    <h1 id="buran-title">
                        Поддерживаем воронежский хоккей
                    </h1>

                    <p class="buran-description">
                        С сезона 2026/27 компания О.А.З.И.С является
                        спонсором хоккейного клуба «Буран».
                    </p>

                    <p class="buran-description buran-description-secondary">
                        Партнёрство объединяет стремление к развитию,
                        системной работе и новым достижениям.
                    </p>
                </div>

                <figure class="buran-page-image">
                    <img
                        src="resource/Buran_page/шарф_ОАЗИСБуран-converted.webp"
                        alt="Шарф с символикой О.А.З.И.С и хоккейного клуба Буран"
                        loading="eager"
                        decoding="async">

                    <figcaption>
                        О.А.З.И.С × ХК «Буран», сезон 2026/27.
                    </figcaption>
                </figure>

            </div>
        </section>
    </main>

    <div id="footer-placeholder"></div>
</body>
</html>
